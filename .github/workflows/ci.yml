name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and check tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Linux graphics development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked
      - name: Verify official card inventory offline
        run: |
          python3 tools/import_catalog.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Exercise every matchup and starting side
        run: cargo run --locked --bin simulate -- --seeds 8
      - name: Build the client and bot tools
        run: cargo build --locked --release --bins
      - name: Run the example bot through the JSON protocol
        run: |
          python3 examples/random_bot.py --binary target/release/rift-api --seed 42
          python3 examples/random_bot.py --binary target/release/rift-api --seed 43 --first-player 1
          python3 examples/random_bot.py --binary target/release/rift-api --seed 44 --difficulty strategic
          python3 tools/check_master_yi_reactions_api.py target/release/rift-api "$RUNNER_TEMP/local-rift-reactions.json"
          python3 tools/check_master_yi_registration_api.py target/release/rift-api "$RUNNER_TEMP/local-rift-yi-matches.json"
      - name: Exercise desktop controls at both window sizes
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-ui" xvfb-run -a ./target/release/local-rift --ui-smoke
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-ui-small" xvfb-run -a ./target/release/local-rift --ui-smoke --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-presets" xvfb-run -a ./target/release/local-rift --ui-smoke-presets
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-presets-small" xvfb-run -a ./target/release/local-rift --ui-smoke-presets --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-ai" xvfb-run -a ./target/release/local-rift --ui-smoke-ai
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-ai-small" xvfb-run -a ./target/release/local-rift --ui-smoke-ai --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-irelia" xvfb-run -a ./target/release/local-rift --ui-smoke-irelia
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-irelia-small" xvfb-run -a ./target/release/local-rift --ui-smoke-irelia --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-riven" xvfb-run -a ./target/release/local-rift --ui-smoke-riven
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-riven-small" xvfb-run -a ./target/release/local-rift --ui-smoke-riven --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-blade" xvfb-run -a ./target/release/local-rift --ui-smoke-blade
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-blade-small" xvfb-run -a ./target/release/local-rift --ui-smoke-blade --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-riven-champion" xvfb-run -a ./target/release/local-rift --ui-smoke-riven-champion
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-riven-champion-small" xvfb-run -a ./target/release/local-rift --ui-smoke-riven-champion --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-unyielding" xvfb-run -a ./target/release/local-rift --ui-smoke-unyielding
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-unyielding-small" xvfb-run -a ./target/release/local-rift --ui-smoke-unyielding --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-repulse" xvfb-run -a ./target/release/local-rift --ui-smoke-repulse
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-repulse-small" xvfb-run -a ./target/release/local-rift --ui-smoke-repulse --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-alpha" xvfb-run -a ./target/release/local-rift --ui-smoke-alpha
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-alpha-small" xvfb-run -a ./target/release/local-rift --ui-smoke-alpha --small
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-conditional-equipment" xvfb-run -a ./target/release/local-rift --ui-smoke-conditional-equipment
          XDG_DATA_HOME="$RUNNER_TEMP/local-rift-conditional-equipment-small" xvfb-run -a ./target/release/local-rift --ui-smoke-conditional-equipment --small
          RIFT_SERIES_PLAYER=1 RIFT_SERIES_OPPONENT=5 XDG_DATA_HOME="$RUNNER_TEMP/local-rift-yi-series" xvfb-run -a ./target/release/local-rift --ui-smoke-series
          RIFT_SERIES_PLAYER=5 RIFT_SERIES_OPPONENT=1 XDG_DATA_HOME="$RUNNER_TEMP/local-rift-yi-series-small" xvfb-run -a ./target/release/local-rift --ui-smoke-series --small
